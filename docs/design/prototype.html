<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Condos prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
<style>
  /* Layout: the route map fills the window, map-app style. Zoom is the navigation. Detail lives in a side panel on desktop and a bottom sheet on phones. */
  :root {
    --page: #E3E5E0;
    --page-ink: #1A1E1C;
    --page-muted: #5A615C;

    --bg: #F3F4F0;
    --surface: #FFFFFF;
    --ink: #161A17;
    --muted: #5C6560;
    --faint: #8B938C;
    --line: #D6DAD3;
    --wash: #E9ECE6;

    /* Official route-map line colours */
    --sukh: #78BE20;
    --silom: #00857C;
    --mrt: #1E3E93;
    --river: #D3E6EE;

    --ok: #0C7A3E;
    --ok-wash: #E3F0E7;
    --view: #8E4B2A;
    --view-wash: #F4E9E2;
    --pend: #6A655F;
    --pend-wash: #EEECE8;
    --rej: #C4342A;
    --rej-wash: #FBEDEC;

    --wall: #E7E4DC;
    --glass: #D7E0DC;
    --floor: #D3CBBE;
    --sky: #E3E8E4;

    --sans: "Instrument Sans", "Avenir Next", "Segoe UI", sans-serif;

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 24px;
    --shadow-float: 0 1px 2px #161A1714, 0 8px 24px -8px #161A1733;
    --shadow-sheet: 0 -1px 0 #161A170F, 0 -16px 40px -20px #161A1740;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--page-ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--mrt); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- app shell: the map is the window ---------- */
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.4; overscroll-behavior: none; }
  .app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); isolation: isolate; }

  /* map */
  .stage { position: absolute; inset: 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .stage.dragging { cursor: grabbing; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #map text { font-family: var(--sans); }
  .st-lab {
    font-size: 10.5px; font-weight: 500; fill: var(--ink);
    stroke: var(--bg); stroke-width: 3.5px; paint-order: stroke fill; stroke-linejoin: round;
  }
  .st-lab.hot { font-weight: 650; font-size: 11.5px; }
  .st-lab.focus { font-weight: 650; font-size: 15px; stroke-width: 5px; }
  .st-code { font-size: 8.5px; font-weight: 700; letter-spacing: .04em; }
  .badge-num { font-size: 13px; font-weight: 700; fill: #fff; font-variant-numeric: tabular-nums; }
  .ring-lab {
    font-size: 9.5px; font-weight: 600; fill: var(--muted); letter-spacing: .02em;
    stroke: var(--bg); stroke-width: 3px; paint-order: stroke fill;
    font-variant-numeric: tabular-nums;
  }
  .river-lab { font-family: var(--sans); font-style: italic; font-weight: 500; font-size: 12px; fill: #7FA3B3; }
  .hit { cursor: pointer; }

  /* unit callouts on the map */
  #callouts { position: absolute; inset: 0; pointer-events: none; }
  .callout {
    position: absolute; left: 0; top: 0;
    width: 168px;
    padding: 7px 9px 8px;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-float);
    pointer-events: auto; cursor: pointer;
    transition: box-shadow .2s, outline-color .2s;
    outline: 1.5px solid transparent;
    will-change: transform, opacity;
  }
  .callout:hover { outline-color: var(--line); }
  .callout.sel { outline-color: var(--ink); }
  .callout b { display: block; font-size: 12.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
  .callout .meta { display: flex; justify-content: space-between; gap: 6px; margin-top: 2px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .callout .meta em { font-style: normal; color: var(--ink); font-weight: 600; }
  .callout .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  /* ---------- floating chrome ---------- */
  .top {
    position: absolute; left: 0; right: 0; top: 0; z-index: 4;
    padding: 4px 14px 10px;
    background: linear-gradient(var(--bg) 70%, #F3F4F000);
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; }
  .brand strong { font-weight: 650; font-size: 22px; letter-spacing: -.03em; line-height: 1; }
  .brand span { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .filter-card { width: max-content; max-width: 100%; }
  .filter-card.open {
    width: 100%;
    background: var(--surface);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-float);
    padding: 10px 12px 12px;
  }
  .filter-toggle {
    height: 36px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 14px;
    border: 0; border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow-float);
    font-size: 13.5px; font-weight: 650; cursor: pointer;
  }
  .filter-toggle::after {
    content: ""; width: 7px; height: 7px; margin-left: 2px;
    border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
    transform: rotate(45deg) translateY(-2px);
  }
  .filter-card.open .filter-toggle {
    width: 100%; justify-content: space-between;
    height: auto; padding: 2px 2px 8px;
    background: none; box-shadow: none; border-radius: 0;
  }
  .filter-card.open .filter-toggle::after { transform: rotate(225deg) translateY(-1px); }
  .filter-toggle i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); display: block; }
  #fMore { display: grid; gap: 10px; margin-top: 2px; }
  .rent-filter { min-width: 0; }
  .f-label {
    display: block;
    margin: 0 2px 6px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .f-block + .f-block { margin-top: 12px; }
  .f-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .f-head .f-label { margin: 0; }
  .f-head b { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.split { display: grid; grid-template-columns: 1fr 1fr; }
  .chips.split .chip { justify-content: center; }
  .chip {
    flex: none; height: 32px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 12px 0 10px;
    border: 0; border-radius: 16px;
    background: var(--wash);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .chip svg { width: 15px; height: 15px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .chip.more { padding: 0 12px; margin-top: 8px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
  .chip.more[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
  .f-more { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .price-range {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px; margin: 2px 0 0; background: none; cursor: pointer;
  }
  .price-range:focus-visible { outline: none; }
  .price-range::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--ink) var(--p, 100%), var(--line) var(--p, 100%));
  }
  .price-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -7px;
    border-radius: 50%; background: var(--ink);
    border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--ink);
  }
  .price-range::-moz-range-track { height: 4px; border: 0; border-radius: 2px; background: var(--line); }
  .price-range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--ink); }
  .price-range::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--ink);
    border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--ink);
  }
  .marks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .marks button {
    height: 28px; padding: 0 10px; border: 0; border-radius: 14px;
    background: var(--wash); font: 600 12px var(--sans); cursor: pointer;
  }
  .marks button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .fab-stack {
    position: absolute; right: 14px; z-index: 3;
    display: flex; flex-direction: column; gap: 1px;
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-float);
    transition: bottom .35s var(--ease);
  }
  .fab {
    width: 42px; height: 42px; border: 0; background: var(--surface);
    display: grid; place-items: center; cursor: pointer;
  }
  .fab:hover { background: var(--wash); }
  .fab svg { width: 18px; height: 18px; }
  .back-pill {
    position: absolute; left: 14px; z-index: 3;
    height: 36px; padding: 0 14px 0 10px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 18px; background: var(--ink); color: var(--bg);
    font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: var(--shadow-float);
    transition: opacity .25s, transform .25s var(--ease), bottom .35s var(--ease);
  }
  .back-pill svg { width: 16px; height: 16px; }
  .back-pill.off { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .toast {
    position: absolute; left: 50%; top: calc(var(--chrome-h, 72px) + 10px); z-index: 5;
    transform: translateX(-50%);
    padding: 8px 14px; border-radius: 18px;
    background: var(--ink); color: var(--bg);
    font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: opacity .25s;
  }

  /* ---------- bottom sheet ---------- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    height: 100%;
    background: var(--surface);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    box-shadow: var(--shadow-sheet);
    display: flex; flex-direction: column;
    transform: translateY(calc(100% - var(--sheet-h, 180px)));
    transition: transform .42s var(--ease);
    will-change: transform;
  }
  .sheet.dragging { transition: none; }
  .grab { flex: none; padding: 8px 0 4px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .grab i { width: 38px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 28px; }
  .sheet-body::-webkit-scrollbar { width: 0; }
  .home { flex: none; height: 22px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px; background: var(--surface); position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; pointer-events: none; }
  .home i { width: 120px; height: 4px; border-radius: 4px; background: var(--ink); display: block; }

  .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .h-serif { font-weight: 650; letter-spacing: -.03em; line-height: 1.15; margin: 0; text-wrap: balance; }

  /* overview */
  .ov-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .ov-head h2 { font-size: 22px; }
  .ov-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .st-cards { display: flex; gap: 10px; margin: 14px -18px 0; padding: 2px 18px 4px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .st-cards::-webkit-scrollbar { display: none; }
  .st-card {
    flex: none; width: 148px; scroll-snap-align: start;
    padding: 11px 12px 12px; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--surface); text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color .2s, transform .2s var(--ease);
  }
  .st-card:hover { border-color: var(--ink); }
  .st-card:active { transform: scale(.98); }
  .st-card .codes { display: flex; gap: 4px; align-self: flex-start; }
  .st-card .nm { font-size: 16px; font-weight: 650; line-height: 1.15; letter-spacing: -.02em; }
  .st-card .ct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .st-card .ct b { color: var(--ink); font-weight: 650; }
  .st-card.zero { opacity: .5; }
  .code {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; height: 22px; padding: 0 7px; border-radius: 6px;
    color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .08em;
  }
  .code.sukh { background: var(--sukh); color: #12300A; }
  .code.silom { background: var(--silom); }
  .code.mrt { background: var(--mrt); }
  .code.station { height: 26px; padding: 0 10px; border-radius: 8px; letter-spacing: -.01em; font-size: 12.5px; font-weight: 650; }
  .lines-key { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .lines-key span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .lines-key i { width: 18px; height: 5px; border-radius: 3px; display: block; }

  /* station */
  .stn-head { display: flex; align-items: flex-start; gap: 12px; }
  .stn-head .h-serif { font-size: 26px; }
  .stn-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .stn-head .codes { display: flex; gap: 4px; margin-top: 6px; }
  .seg { display: flex; gap: 6px; margin: 16px 0 10px; }
  .seg span { font-size: 12px; color: var(--muted); }
  .units { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ucard {
    width: 100%;
    display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 12px;
    padding: 10px; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--surface); text-align: left; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .ucard:hover, .ucard.sel { border-color: var(--ink); }
  .ucard .thumb { grid-row: span 2; width: 64px; height: 64px; border-radius: var(--r-sm); overflow: hidden; background: var(--wall); }
  .ucard .thumb svg { width: 100%; height: 100%; display: block; }
  .ucard .t { min-width: 0; }
  .ucard .t b { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
  .ucard .t small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ucard .p { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 14.5px; letter-spacing: -.02em; }
  .ucard .p small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  .ucard .f { grid-column: 2 / 4; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ucard.miss { opacity: .5; }
  .missnote { font-size: 11.5px; color: var(--rej); font-weight: 600; }
  .empty { padding: 18px 0 6px; color: var(--muted); }
  .empty p { margin: 0 0 12px; }
  .btn {
    height: 40px; padding: 0 16px; border: 0; border-radius: 20px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 600; cursor: pointer;
    text-decoration: none;
  }
  .btn.ghost { background: var(--wash); color: var(--ink); }
  .btn svg { width: 16px; height: 16px; }

  /* tiny facility trio */
  .trio { display: inline-flex; gap: 4px; }
  .trio i {
    width: 22px; height: 22px; border-radius: 7px;
    display: grid; place-items: center;
    background: var(--ok-wash); color: var(--ok);
  }
  .trio i.no { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); position: relative; }
  .trio i.no::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1.2px; background: var(--faint); transform: rotate(-35deg); }
  .trio svg { width: 14px; height: 14px; display: block; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; display: block; background: currentColor; }
  .pill.ok { background: var(--ok-wash); color: var(--ok); }
  .pill.view { background: var(--view-wash); color: var(--view); }
  .pill.pend { background: var(--pend-wash); color: var(--pend); }
  .pill.rej { background: var(--rej-wash); color: var(--rej); }

  /* unit dossier */
  .dossier-bar {
    position: sticky; top: -4px; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    margin: -4px -18px 0; padding: 4px 18px 10px;
    background: var(--surface);
  }
  .icon-btn {
    width: 36px; height: 36px; flex: none; border: 0; border-radius: 18px;
    display: grid; place-items: center; background: var(--wash); cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .crumb { font-size: 13.5px; font-weight: 600; }
  .crumb small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
  .gallery { position: relative; margin: 4px -18px 0; }
  .shots { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 18px; scrollbar-width: none; }
  .shots::-webkit-scrollbar { display: none; }
  .shot { flex: none; width: calc(100% - 44px); scroll-snap-align: center; margin: 0; position: relative; }
  .art { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--wall); position: relative; }
  .art svg { display: block; width: 100%; height: 100%; }
  .shot figcaption {
    position: absolute; left: 10px; bottom: 10px;
    padding: 3px 9px; border-radius: 10px;
    background: #161A17B3; color: #fff;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .dots { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .25s var(--ease), background .25s; }
  .dots i.on { width: 16px; background: var(--ink); }

  .d-name { margin: 14px 0 0; font-size: 26px; }
  .d-type { display: flex; align-items: center; gap: 6px; margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .d-type svg, .type-ico { width: 15px; height: 15px; flex: none; }
  .type-ico { display: inline-block; vertical-align: -2px; margin-right: 3px; }
  .d-where { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .d-where b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .walk { display: inline-flex; align-items: center; gap: 4px; }
  .walk svg { width: 14px; height: 14px; }
  .d-price { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .amt { display: flex; align-items: baseline; font-size: 38px; font-weight: 600; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .amt .cur { font-weight: 600; font-size: 22px; letter-spacing: 0; margin-right: 2px; }
  .amt small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 4px; }
  .status-note { margin: 12px 0 0; font-size: 14px; }
  .viewing { margin-top: 14px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--view-wash); color: var(--view); font-size: 13px; }
  .viewing b { font-weight: 650; }
  .viewing svg { width: 18px; height: 18px; flex: none; }

  .specs { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--wash); border-radius: var(--r-md); }
  .specs div { padding: 11px 12px; }
  .specs div + div { box-shadow: inset 1px 0 0 var(--surface); }
  .specs b { display: block; font-size: 17px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .specs span { display: block; margin-top: 2px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .dsec { margin-top: 24px; }

      const k = Math.exp(Math.log(k0_) + (Math.log(k1) - Math.log(k0_)) * e);
      const cx = c0.x + (wx - c0.x) * e, cy = c0.y + (wy - c0.y) * e;
      setCam(k, sx - cx * k, sy - cy * k);
      if (p < 1) anim = requestAnimationFrame(step); else afterMove();
    };
    anim = requestAnimationFrame(step);
  }
  const toS = (x, y) => [x * cam.k + cam.tx, y * cam.k + cam.ty];

  /* ---------------- draw ---------------- */
  function draw() {
    const z = cam.k / k0;
    world.setAttribute("transform", `matrix(${cam.k} 0 0 ${cam.k} ${cam.tx} ${cam.ty})`);
    const lw = 5 * clamp(Math.sqrt(z), .8, 2.1);
    linePaths.forEach(p => p.setAttribute("stroke-width", p.stub ? lw * .6 : lw));
    $(".river", svg).setAttribute("stroke-width", 14 * clamp(z, .6, 6));
    { const [x, y] = toS(212, 402); riverLab.setAttribute("transform", `translate(${x} ${y}) rotate(-74)`); riverLab.setAttribute("opacity", ramp(z, .8, 1.1) * (1 - ramp(z, 3, 4))); }
    stubLabs.forEach(({ s, t }) => { const [x, y] = toS(s.x, s.y); t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("opacity", 1 - ramp(z, 2.5, 3.2)); });

    const pinA = ramp(z, 1.7, 2.5);        // units appear
    const pxKm = cam.k * KM;
    const coA = ramp(z, 2.6, 3.2) * ramp(pxKm, 95, 130);   // callouts need room: ~100 px per km
    const focusId = mode.v === "overview" ? null : (mode.v === "station" || mode.v === "add" ? mode.id : U.find(u => u.id === mode.id).st);
    let nearId = null;

    linkEls.forEach(L => { const [ax, ay] = toS(L.a.x, L.a.y), [bx, by] = toS(L.b.x, L.b.y); for (const n of [L.n, L.m]) { n.setAttribute("x1", ax); n.setAttribute("y1", ay); n.setAttribute("x2", bx); n.setAttribute("y2", by); } });

    for (const E of stEls) {
      const { s, g, dot, t, badge } = E;
      const [x, y] = toS(s.x, s.y);
      g.setAttribute("transform", `translate(${x} ${y})`);
      const live = unitsAt(s.id).filter(matches);
      const has = live.length > 0;
      const focus = s.id === focusId && z > 2.2;
      // empty stations fade; their names fade out further when zoomed far out
      const dimDot = .32;
      const dimLab = has ? 1 : (s.lines.length > 1 ? .7 : .5 * ramp(cam.k, .98, 1.12));
      dot.setAttribute("opacity", has ? 0 : dimDot);
      if (!has) {
        dot.setAttribute("r", (s.lines.length > 1 ? 6.5 : 4.6) * (focus ? 1.8 : 1));
        dot.setAttribute("fill", focus ? LINES[lineOf(s)].color : "var(--surface)");
      }
      t.setAttribute("opacity", dimLab);
      t.classList.toggle("hot", has && !focus);
      const fpos = focus ? freeSide(s) : null;
      const plainOff = has ? 26 : (s.lines.length > 1 ? 11 : 9);
      if (focus !== t.classList.contains("focus") || (focus && t.dataset.pos !== fpos)) {
        t.classList.toggle("focus", focus);
        const off = focus ? 30 : plainOff;
        placeLabel(t, focus ? fpos : s.pos, focus ? 1 : E.nLines, off);
        t.replaceChildren(); if (focus) { const ts = el("tspan", { x: 0 }, t); ts.textContent = s.name; } else lab(t, s);
        E.off = off;
      } else if (!focus && E.off !== plainOff) {
        E.off = plainOff;
        placeLabel(t, s.pos, E.nLines, plainOff);
      }
      badge.setAttribute("opacity", has ? 1 : 0);
      badge.num.textContent = String(live.length);
    }

    if (!focusId) { const vc = visCenter(); let bd = 1e9; for (const id of activeIds()) { const [x, y] = toS(ST[id].x, ST[id].y), d = Math.hypot(x - vc.x, y - vc.y); if (d < bd) { bd = d; nearId = id; } } }
    ringEls.forEach(R => {
      const isF = R.id === focusId || (!focusId && R.id === nearId);
      const a = pinA * (isF ? 1 : .22);
      R.g.setAttribute("opacity", a);
      const s = ST[R.id];
      R.labs.forEach((t, i) => {
        const r = RINGS[i] / 1000 * KM * cam.k, [x, y] = toS(s.x, s.y);
        t.setAttribute("x", x + r * .72 + 3); t.setAttribute("y", y - r * .72 - 3);
        t.setAttribute("opacity", isF && r > 40 ? a * ramp(z, 2.6, 3.4) : 0);
      });
    });

    U.forEach((u, i) => {
      const ok = matches(u);
      const a = pinA * (ok ? 1 : .35);
      leadEls[i].setAttribute("opacity", a);
      const [x, y] = toS(u.x, u.y);
      const P = pinEls[i];
      P.g.setAttribute("transform", `translate(${x} ${y})`);
      P.g.setAttribute("opacity", a);
      P.g.style.pointerEvents = a > .3 ? "auto" : "none";
      P.g.sel.setAttribute("opacity", selUnit === u.id || hoverUnit === u.id ? 1 : 0);
    });
    layoutCallouts(coA, focusId || nearId);
  }

  // the focused station's name goes on the side with the fewest unit pins (and away from the line)
  function freeSide(s) {
    const dirs = { b: [0, 1], t: [0, -1], r: [1, 0], l: [-1, 0] };
    let best = "b", bs = 1e9;
    for (const k in dirs) {
      const [dx, dy] = dirs[k];
      let score = 0;
      for (const u of unitsAt(s.id)) {
        const ux = (u.x - s.x) * cam.k, uy = (u.y - s.y) * cam.k, d = Math.hypot(ux, uy);
        if (d < 110) score += Math.max(0, (ux * dx + uy * dy) / (d || 1)) * (110 - d);
      }
      if (k === "b" || k === "t") score -= 1;   // a tie prefers above or below
      if (score < bs) { bs = score; best = k; }
    }
    return best;
  }

  // callouts sit beside their pin, pushed outward from the station, kept on screen and off each other
  function layoutCallouts(alpha, onlySt) {
    const boxes = [];
    const v = vis(), bottom = v.b - 8, TOP = v.t + 4, L = v.l + 8;
    const pill = $("#backPill");
    if (pill && !pill.classList.contains("off")) {
      const pr = pill.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      boxes.push({ x: pr.left - sr.left - 6, y: pr.top - sr.top - 6, w: pr.width + 12, h: pr.height + 12 });
    }
    for (const E of stEls) {
      const [x, y] = toS(E.s.x, E.s.y);
      if (x < L - 30 || x > W + 30 || y < TOP - 30 || y > bottom + 30) continue;
      const hot = Number(E.badge.getAttribute("opacity")) > 0.2;
      const r = hot ? 20 : 12;
      boxes.push({ x: x - r, y: y - r, w: r * 2, h: r * 2 });
    }
    const focusSt = stEls.find(E => E.t.classList.contains("focus"));
    if (focusSt) {
      const [x, y] = toS(focusSt.s.x, focusSt.s.y), p = focusSt.t.dataset.pos, w = focusSt.s.name.length * 9 + 10;
      const box = { b: [x - w / 2, y + 10], t: [x - w / 2, y - 44], r: [x + 14, y - 14], l: [x - w - 14, y - 14] }[p] || [x - w / 2, y + 10];
      boxes.push({ x: box[0], y: box[1], w, h: 30 }, { x: x - 16, y: y - 16, w: 32, h: 32 });
    }
    const list = coEls.map(c => {
      const u = c.u, [px, py] = toS(u.x, u.y), [sx, sy] = toS(ST[u.st].x, ST[u.st].y);
      const right = px >= sx, below = py >= sy - 4;
      let x = right ? px + 14 : px - 14 - c.w;
      let y = below ? py - 6 : py - c.h + 6;
      return { c, px, py, x, y, w: c.w, h: c.h || 64, vis: alpha > 0 && u.st === onlySt && px > v.l - 40 && px < W + 40 && py > v.t - 20 && py < bottom + 20 };
    }).filter(b => { if (!b.vis) { b.c.d.style.opacity = 0; b.c.d.style.pointerEvents = "none"; } return b.vis; });
    list.sort((a, b) => a.py - b.py);
    for (const b of list) {
      b.x = clamp(b.x, L, W - b.w - 8);
      b.y = clamp(b.y, TOP, Math.max(TOP, bottom - b.h));
      for (let pass = 0; pass < 6; pass++) {
        let moved = false;
        for (const o of boxes) {
          if (b.x < o.x + o.w + 4 && b.x + b.w + 4 > o.x && b.y < o.y + o.h + 4 && b.y + b.h + 4 > o.y) {
            const down = o.y + o.h + 6, up = o.y - b.h - 6;
            b.y = (Math.abs(down - b.y) <= Math.abs(up - b.y) && down + b.h < bottom) || up < TOP ? down : up;
            moved = true;
          }
        }
        if (!moved) break;
      }
      boxes.push(b);
      const ok = matches(b.c.u);
      b.c.d.classList.toggle("miss", !ok);
      b.c.d.classList.toggle("sel", selUnit === b.c.u.id);
      b.c.d.classList.toggle("hov", hoverUnit === b.c.u.id);
      b.c.d.style.opacity = alpha * (ok ? 1 : .45);
      b.c.d.style.pointerEvents = alpha > .5 ? "auto" : "none";
      b.c.d.style.transform = `translate(${b.x}px, ${b.y}px)`;
    }
  }

  /* ---------------- gestures ---------------- */
  const ptrs = new Map();
  let gesture = null;
  stage.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    cancelAnimationFrame(anim);
    try { stage.setPointerCapture(e.pointerId); } catch {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = stage.getBoundingClientRect();
    gesture = { start: performance.now(), moved: 0, target: e.target, k: cam.k, tx: cam.tx, ty: cam.ty, r, pts: [...ptrs.values()].map(p => ({ ...p })) };
  });
  stage.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId) || !gesture) return;
    const prev = ptrs.get(e.pointerId);
    gesture.moved += Math.hypot(e.clientX - prev.x, e.clientY - prev.y);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = [...ptrs.values()], r = gesture.r;
    if (gesture.moved > 4) stage.classList.add("dragging");
    if (pts.length === 1 && gesture.pts.length === 1) {
      const p0 = gesture.pts[0];
      setCam(gesture.k, gesture.tx + pts[0].x - p0.x, gesture.ty + pts[0].y - p0.y);
    } else if (pts.length >= 2) {
      if (gesture.pts.length < 2) gesture = { ...gesture, k: cam.k, tx: cam.tx, ty: cam.ty, pts: pts.map(p => ({ ...p })) };
      const [a0, b0] = gesture.pts, [a, b] = pts;
      const d0 = Math.hypot(a0.x - b0.x, a0.y - b0.y), d1 = Math.hypot(a.x - b.x, a.y - b.y);
      const m0 = { x: (a0.x + b0.x) / 2 - r.left, y: (a0.y + b0.y) / 2 - r.top }, m1 = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
      const k = clamp(gesture.k * d1 / d0, k0 * .42, k0 * 10);
      const wx = (m0.x - gesture.tx) / gesture.k, wy = (m0.y - gesture.ty) / gesture.k;
      setCam(k, m1.x - wx * k, m1.y - wy * k);
    }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size) return;
    stage.classList.remove("dragging");
    const g = gesture; gesture = null;
    if (!g) return;
    if (g.moved < 6 && performance.now() - g.start < 500) tap(g.target);
    else afterMove();
  };
  stage.addEventListener("pointerup", endPtr);
  stage.addEventListener("pointercancel", endPtr);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    cancelAnimationFrame(anim);
    const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0022));
    const k = clamp(cam.k * f, k0 * .42, k0 * 10);
    const wx = (mx - cam.tx) / cam.k, wy = (my - cam.ty) / cam.k;
    setCam(k, mx - wx * k, my - wy * k);
    clearTimeout(stage.wt); stage.wt = setTimeout(afterMove, 220);
  }, { passive: false });
  stage.addEventListener("dblclick", e => {
    const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    flyTo(cam.k * 2, (mx - cam.tx) / cam.k, (my - cam.ty) / cam.k, mx, my);
  });
  stage.addEventListener("keydown", e => {
    const t = e.target.closest("[data-st]");
    if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openStation(t.dataset.st); }
  });

  function tap(target) {
    const u = target.closest && target.closest("[data-u]");
    if (u) return openUnit(u.dataset.u);
    const s = target.closest && target.closest("[data-st]");
    if (s) return openStation(s.dataset.st);
  }

  // After a free pan or pinch, the sheet follows the nearest station with units.
  function afterMove() {
    const z = cam.k / k0;
    $("#backPill").classList.toggle("off", z < 1.5 && mode.v === "overview");
    if (mode.v === "unit" || mode.v === "add" || mode.v === "edit") return;
    if (z < 1.5) { if (mode.v !== "overview") { mode = { v: "overview" }; render(); setSheet("peek"); } return; }
    if (z < 2.2) return;
    const vc = visCenter();
    let best = null, bd = 1e9;
    for (const id of activeIds()) { const [x, y] = toS(ST[id].x, ST[id].y), d = Math.hypot(x - vc.x, y - vc.y); if (d < bd) { bd = d; best = id; } }
    if (best && bd < Math.min(W, H) * .45 && !(mode.v === "station" && mode.id === best)) {
      mode = { v: "station", id: best }; render(); setSheet(desk.matches ? "half" : "peek"); draw();
    }
  }

  /* ---------------- navigation ---------------- */
  function focusStation(id, animate = true) {
    const s = ST[id], us = unitsAt(id);
    const far = Math.max(600, ...us.map(u => u.m)) / 1000 * KM;
    const v = vis(), vc = visCenter(), room = Math.min((v.r - v.l) / 2 - (desk.matches ? 110 : 34), (v.b - v.t) / 2 - 30);
    const k = clamp(room / far, k0 * 3.4, k0 * 9);
    flyTo(k, s.x, s.y, vc.x, vc.y, animate);
  }
  function openStation(id) {
    selUnit = null;
    mode = { v: "station", id };
    render();
    setSheet(desk.matches ? "half" : "peek");   // phones keep the map big; swipe up for the list
    focusStation(id);
    $("#backPill").classList.remove("off");
    if (!unitsAt(id).length) toast(`Nothing on file near ${ST[id].name} yet`);
  }
  function openAdd(id) {
    mode = { v: "add", id };
    render();
    setSheet("full");
    $("#backPill").classList.remove("off");
    draw();
  }
  function openEdit(id) {
    if (!U.some(x => x.id === id)) return;
    selUnit = id;
    mode = { v: "edit", id };
    render();
    setSheet("full");
    $("#backPill").classList.remove("off");
    draw();
  }
  function openUnit(id) {
    const u = U.find(x => x.id === id);
    const from = mode;
    selUnit = id;
    mode = { v: "unit", id };
    render();
    setSheet("full");
    if (desk.matches && (cam.k / k0 < 2.5 || !(from.v === "station" && from.id === u.st))) focusStation(u.st);
    draw();
    $("#backPill").classList.remove("off");
  }
  function goOverview() {
    selUnit = null;
    mode = { v: "overview" };
    render();
    setSheet("peek");
    home();
    $("#backPill").classList.add("off");
  }
  $("#backPill").addEventListener("click", goOverview);
  const zoomBy = f => { const vc = visCenter(); flyTo(cam.k * f, (vc.x - cam.tx) / cam.k, (vc.y - cam.ty) / cam.k, vc.x, vc.y); };
  $("#zin").addEventListener("click", () => zoomBy(1.8));
  $("#zout").addEventListener("click", () => zoomBy(1 / 1.8));

  let tt;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false; t.style.opacity = 1;
    clearTimeout(tt); tt = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 260); }, 2200);
  }

  /* ---------------- filters ---------------- */
  function syncPrice() {
    const pct = ((maxPrice - PRICE_MIN) / (PRICE_MAX - PRICE_MIN)) * 100;
    const slider = $("#price");
    slider.value = String(maxPrice);
    slider.style.setProperty("--p", pct + "%");
    $("#priceLabel").textContent = maxPrice >= PRICE_MAX ? "Any" : "≤ ฿" + baht(maxPrice);
    $("#filterDot").hidden = !(filters.size || typeFilters.size || maxPrice < PRICE_MAX);
  }
  function applyFilters() {
    $("#filterDot").hidden = !(filters.size || typeFilters.size || maxPrice < PRICE_MAX);
    render({ keep: true });
    draw();
  }
  document.querySelectorAll(".chip[data-f]").forEach(b => b.addEventListener("click", () => {
    const f = b.dataset.f;
    filters.has(f) ? filters.delete(f) : filters.add(f);
    b.setAttribute("aria-pressed", String(filters.has(f)));
    applyFilters();
  }));
  document.querySelectorAll(".chip[data-type]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.type;
    typeFilters.has(t) ? typeFilters.delete(t) : typeFilters.add(t);
    if (typeFilters.size === 2) typeFilters.clear();
    document.querySelectorAll(".chip[data-type]").forEach(x => x.setAttribute("aria-pressed", String(typeFilters.has(x.dataset.type))));
    applyFilters();
  }));
  $("#price").addEventListener("input", () => { maxPrice = Number($("#price").value); syncPrice(); applyFilters(); });
  $("#moreFilters").addEventListener("click", () => { if (desk.matches) return; moreOpen = !moreOpen; syncChrome(); draw(); });

  /* ---------------- bottom sheet ---------------- */
  const sheet = $("#sheet"), body = $("#sheetBody");
  let sheetState = "peek";
  const appH = () => $("#app").getBoundingClientRect().height;
  const SNAP = { peek: () => mode.v === "overview" ? 214 : 132, half: () => Math.round(appH() * .46), full: () => appH() - 8 };
  const sheetH = () => desk.matches ? 0 : SNAP[sheetState]();
  function setSheet(st) {
    sheetState = st;
    if (desk.matches) { ["fabs", "backPill"].forEach(i => $("#" + i).style.bottom = ""); return; }
    sheet.style.setProperty("--sheet-h", sheetH() + "px");
    const b = sheetH() + 12;
    $("#fabs").style.bottom = b + "px";
    $("#backPill").style.bottom = b + "px";
    $("#fabs").style.opacity = st === "full" ? 0 : 1;
  }
  // drag the handle (or the top of the sheet) between peek, half and full
  {
    let d = null;
    const startDrag = e => {
      if (desk.matches) return;
      if (e.target.closest("button, a, input, textarea, .shots, .st-cards")) return;
      if (body.scrollTop > 0 && !e.target.closest(".grab")) return;
      d = { y: e.clientY, h: sheetH(), id: e.pointerId, moved: 0 };
      sheet.classList.add("dragging");
    };
    const move = e => {
      if (!d || e.pointerId !== d.id) return;
      d.moved = d.y - e.clientY;
      if (Math.abs(d.moved) > 4 && !d.cap) { try { sheet.setPointerCapture(e.pointerId); } catch {} d.cap = true; }
      const h = clamp(d.h + d.moved, 120, SNAP.full());
      sheet.style.setProperty("--sheet-h", h + "px");
    };
    const end = e => {
      if (!d || e.pointerId !== d.id) return;
      sheet.classList.remove("dragging");
      const h = d.h + d.moved, opts = Object.keys(SNAP);
      let best = sheetState;
      if (Math.abs(d.moved) > 4) best = opts.reduce((a, b) => Math.abs(SNAP[b]() - h) < Math.abs(SNAP[a]() - h) ? b : a);
      else if (e.target.closest(".grab")) best = sheetState === "peek" ? "half" : sheetState === "half" ? "full" : "half";
      d = null;
      setSheet(best);
    };
    sheet.addEventListener("pointerdown", startDrag);
    sheet.addEventListener("pointermove", move);
    sheet.addEventListener("pointerup", end);
    sheet.addEventListener("pointercancel", end);
  }

  /* ---------------- sheet content ---------------- */
  function render(opts = {}) {
    const keep = opts.keep ? body.scrollTop : 0;
    if (mode.v === "overview") body.innerHTML = renderOverview();
    else if (mode.v === "station") body.innerHTML = renderStation(mode.id);
    else if (mode.v === "add") body.innerHTML = renderAdd(mode.id);
    else if (mode.v === "edit") body.innerHTML = renderEdit(mode.id);
    else body.innerHTML = renderUnit(mode.id);
    wireSheet();
    body.scrollTop = keep;
  }
  function filterBlurb() {
    const parts = [];
    if (typeFilters.size === 1) parts.push(TYPE_NAME[[...typeFilters][0]] + " only");
    if (maxPrice < PRICE_MAX) parts.push("rent ≤ ฿" + baht(maxPrice));
    if (filters.size) parts.push("with " + [...filters].map(f => FNAME[f].toLowerCase()).join(", "));
    return parts.length ? parts.join(", ") + ". " : "";
  }

  function renderOverview() {
    const rows = activeIds().map(id => ({ s: ST[id], all: unitsAt(id), live: unitsAt(id).filter(matches) }))
      .sort((a, b) => b.live.length - a.live.length || b.all.length - a.all.length);
    const total = U.filter(matches).length, nSt = rows.filter(r => r.live.length).length;
    return `
      <div class="brandrow"><strong>Condos</strong><span class="eyebrow">Bangkok</span></div>
      <div class="ov-head"><div>
        <h2 class="h-serif"><span class="num">${total}</span> ${total === 1 ? "unit" : "units"} near <span class="num">${nSt}</span> ${nSt === 1 ? "station" : "stations"}</h2>
        ${filterBlurb().trim() ? `<p>${filterBlurb().trim()}</p>` : ""}
      </div></div>
      <div class="st-cards">${rows.map(r => {
        const from = r.live.map(u => u.price);
        return `<button class="st-card ${r.live.length ? "" : "zero"}" data-open-st="${r.s.id}">
          <span class="codes">${lineBadges(r.s)}</span>
          <span class="nm">${esc(r.s.name)}</span>
          <span class="ct"><b>${r.live.length}</b>${filtering() ? ` of ${r.all.length}` : ""} ${r.all.length === 1 && !filtering() ? "unit" : "units"}${from.length ? ` · from ฿${baht(Math.min(...from) / 1000)}k` : ""}</span>
        </button>`; }).join("")}</div>
      <div class="lines-key">${Object.values(LINES).map(l => `<span><i style="background:${l.color}"></i>${l.name}</span>`).join("")}</div>`;
  }

  function renderStation(id) {
    const s = ST[id], all = unitsAt(id);
    const scoped = all.filter(u => typeOk(u) && priceOk(u));
    const ok = scoped.filter(facilityOk), miss = scoped.filter(u => !facilityOk(u));
    const card = u => `<li><button class="ucard ${facilityOk(u) ? "" : "miss"}" data-open-u="${u.id}">
        <span class="thumb">${photo(u, "living")}</span>
        <span class="t"><b>${esc(u.name)}</b><small>${dist(u.m)} · ${u.walk} min · ${typeSvg(u.type, "type-ico")}${TYPE_NAME[u.type] || "Condominium"}${facilityOk(u) ? "" : ` · No ${missing(u).map(f => FNAME[f].toLowerCase()).join(", ")}`}</small></span>
        <span class="p">฿${baht(u.price)}<small>/mo</small></span>
        <span class="f">${trio(u)}${statusPill(u)}</span>
      </button></li>`;
    const nearest = () => {
      let best = null, bd = 1e9;
      for (const a of activeIds()) { const d = Math.hypot(ST[a].x - s.x, ST[a].y - s.y); if (a !== s.id && d < bd) { bd = d; best = a; } }
      return best ? ST[best] : null;
    };
    const near = nearest();
    return `
      <div class="stn-head">
        <div style="flex:1;min-width:0">
          <div class="codes">${lineBadges(s)}</div>
          <h2 class="h-serif" style="margin-top:8px">${esc(s.name)}</h2>
          <p>${all.length ? `${scoped.length} ${scoped.length === 1 ? "unit" : "units"} within ${dist(Math.max(...all.map(u => u.m)))}${filtering() ? ` · ${ok.length} match` : ""}` : "Nothing on file here yet."}</p>
        </div>
      </div>
      <button class="btn ghost" data-add="${s.id}" style="margin-top:14px">Add a unit</button>
      ${scoped.length ? `
        <div class="seg"><span>Nearest first</span></div>
        <ul class="units">${ok.map(card).join("")}</ul>
        ${miss.length ? `<div class="seg" style="margin-top:18px"><span>Missing a facility</span></div><ul class="units">${miss.map(card).join("")}</ul>` : ""}
      ` : `<div class="empty"><p>${all.length ? "Nothing here matches the filters." : "Add a unit from an agent chat and it will appear on the map here."}</p>
          ${near ? `<button class="btn ghost" data-open-st="${near.id}">Nearest with units: ${esc(near.name)}</button>` : ""}</div>`}`;
  }

        <div class="dots" id="dots">${kinds.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>

      <p class="d-where"><span class="walk"><svg><use href="#i-walk"/></svg><b>${dist(u.m)}</b>&nbsp;· ${u.walk} min to ${esc(s.name)}</span>${lineBadges(s)}</p>
      <div class="d-price"><div class="amt"><span class="cur">฿</span>${baht(u.price)}<small>/mo</small></div></div>
      ${u.reason ? `<p class="status-note">${esc(u.reason)}</p>` : ""}

      ${u.status === "view" ? `<div class="viewing"><svg><use href="#i-cal"/></svg><span>Viewing booked · <b>${esc(u.when)}</b></span></div>` : ""}
      <div class="specs"><div><b>${u.size} m²</b><span>Size</span></div><div><b>${u.beds} bed</b><span>Beds</span></div><div><b>${u.floor}</b><span>Floor</span></div></div>

      <section class="dsec">
        <h3>Facilities</h3>
        <div class="musts">${FAC.map(f => `
          <div class="must ${u.fac[f] ? "" : "no"}">

      <section class="dsec">
        <h3>Agent</h3>
        <div class="agent" id="agentCard">
          <button type="button" class="agent-toggle" aria-expanded="false" aria-controls="agentMore">
            <span class="who"><span class="ini">${esc((u.agent.n || "?")[0])}</span><span><b>${esc(u.agent.n)}</b><small>${esc(u.agent.co)}</small></span></span>
            <svg class="chev" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <div id="agentMore" hidden>

              <dt>LINE</dt><dd>${esc(u.agent.line)}</dd>
              <span class="kv-acts">${u.agent.line ? `<a class="copy" href="https://line.me/R/ti/p/~${encodeURIComponent(u.agent.line.replace(/^@/, ""))}" target="_blank" rel="noopener">LINE</a>` : ""}<button class="copy" type="button" data-copy="${esc(u.agent.line)}">Copy</button></span>

  function deleteUnit(id) {
    const i = U.findIndex(x => x.id === id);
    if (i < 0) return;
    const st = U[i].st;
    leadEls[i].remove();
    pinEls[i].g.remove();
    coEls[i].d.remove();
    U.splice(i, 1);
    leadEls.splice(i, 1);
    pinEls.splice(i, 1);
    coEls.splice(i, 1);
    selUnit = null;
    openStation(st);
  }

  function readAgent(form) {
    return {
      n: form.agentName.value.trim() || "Agent",
      co: form.agentCo.value.trim(),
      ph: form.agentPh.value.trim(),
      line: form.agentLine.value.trim(),
    };
  }
  function readFacilities(form) {
    const fac = {};
    FAC.forEach(f => {
      const on = form.querySelector(`[data-fac="${f}"]`).getAttribute("aria-pressed") === "true";
      fac[f] = on ? "Yes" : null;
    });
    return { fac, extras: [...form.querySelectorAll("#extraList [data-extra]")].map(el => el.dataset.extra) };
  }
  function wireFacilities(form) {
    form.querySelectorAll("[data-fac]").forEach(b => b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(on));
    }));
    const extraName = $("#extraName", form);
    const extraList = $("#extraList", form);
    extraList.querySelectorAll("button").forEach(b => b.addEventListener("click", () => b.parentElement.remove()));
    const addExtra = () => {
      const name = extraName.value.trim();
      if (!name || [...extraList.querySelectorAll("[data-extra]")].some(el => el.dataset.extra === name)) return;
      const span = document.createElement("span");
      span.dataset.extra = name;
      span.innerHTML = `${esc(name)} <button type="button" aria-label="Remove ${esc(name)}">×</button>`;
      span.querySelector("button").addEventListener("click", () => span.remove());
      extraList.appendChild(span);
      extraName.value = "";
    };
    $("#extraAdd", form).addEventListener("click", addExtra);
    extraName.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addExtra(); } });
  }

  function wireSheet() {
    body.querySelectorAll("[data-open-st]").forEach(b => b.addEventListener("click", () => openStation(b.dataset.openSt)));
    body.querySelectorAll("[data-open-u]").forEach(b => b.addEventListener("click", () => openUnit(b.dataset.openU)));
    body.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => openAdd(b.dataset.add)));
    body.querySelectorAll("[data-back-st]").forEach(b => b.addEventListener("click", () => openStation(b.dataset.backSt)));
    body.querySelectorAll("[data-back-u]").forEach(b => b.addEventListener("click", () => openUnit(b.dataset.backU)));
    body.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openEdit(mode.id)));
    const addForm = $("#addform", body);
    const editForm = $("#editform", body);
    const facForm = addForm || editForm;
    if (facForm) wireFacilities(facForm);
    if (addForm) {
      let pick = null;
      const save = $("#addSave", addForm);
      const sync = () => { save.disabled = !pick || !addForm.name.value.trim() || !addForm.price.value || !addForm.m.value; };
      addForm.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
        pick = b.dataset.pick;
        addForm.querySelectorAll("[data-pick]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        sync();
      }));
      addForm.addEventListener("input", sync);
      addForm.addEventListener("submit", e => {
        e.preventDefault();
        if (!pick) return;
        const { fac, extras } = readFacilities(addForm);
        const u = {
          id: "u" + Date.now(), st: mode.id, name: addForm.name.value.trim(),
          m: Number(addForm.m.value), brg: Math.round(Math.random() * 360),
          status: "pend", type: pick, price: Number(addForm.price.value),
          size: Number(addForm.size.value) || 30,
          beds: addForm.beds.value === "" ? 1 : Number(addForm.beds.value),
          floor: Number(addForm.floor.value) || 1,
          fac, extras,
          note: "Waiting on the agent to confirm.",
          agent: readAgent(addForm),
          tint: "#D7E0DC", notes: [["2026-10-19", "Added from an agent chat. Waiting to confirm details."]],
        };
        U.push(u);
        mountUnit(u);
        measure();
        openUnit(u.id);
      });
    }
    if (editForm) {
      const u = U.find(x => x.id === mode.id);
      let pick = u.type;
      const save = $("#editSave", editForm);
      const sync = () => { save.disabled = !pick || !editForm.name.value.trim() || !(Number(editForm.price.value) > 0) || !(Number(editForm.m.value) > 0); };
      editForm.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
        pick = b.dataset.pick;
        editForm.querySelectorAll("[data-pick]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        sync();
      }));
      editForm.addEventListener("input", sync);
      editForm.addEventListener("submit", e => {
        e.preventDefault();
        if (!pick) return;
        const { fac, extras } = readFacilities(editForm);
        u.name = editForm.name.value.trim();
        u.type = pick;
        u.price = Number(editForm.price.value);
        u.m = Number(editForm.m.value);
        u.size = Number(editForm.size.value) || 30;
        u.beds = editForm.beds.value === "" ? 1 : Number(editForm.beds.value);
        u.floor = Number(editForm.floor.value) || 1;
        u.fac = fac;
        u.extras = extras;
        u.agent = readAgent(editForm);
        placeUnit(u);
        const i = U.findIndex(x => x.id === u.id);
        leadEls[i].setAttribute("x2", u.x);
        leadEls[i].setAttribute("y2", u.y);
        coEls[i].d.innerHTML = calloutInner(u);
        draw();
        openUnit(u.id);
      });
    }
    const ask = $("[data-ask-del]", body);
    if (ask) {
      const editBtn = $("[data-edit]", body);
      const showAsk = on => {
        $("#delConfirm", body).hidden = !on;
        ask.hidden = on;
        if (editBtn) editBtn.hidden = on;
      };
      ask.addEventListener("click", () => showAsk(true));
      $("[data-del-no]", body).addEventListener("click", () => showAsk(false));
      $("[data-del-yes]", body).addEventListener("click", () => deleteUnit(mode.id));
    }
    const agentToggle = $(".agent-toggle", body);
    if (agentToggle) agentToggle.addEventListener("click", () => {
      const open = agentToggle.getAttribute("aria-expanded") !== "true";
      agentToggle.setAttribute("aria-expanded", String(open));
      agentToggle.closest(".agent").classList.toggle("open", open);
      $("#agentMore", body).hidden = !open;
    });
    const back = $("[data-back]", body);
    if (back) back.addEventListener("click", () => { const u = U.find(x => x.id === mode.id); openStation(u.st); });
    body.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.copy;
      const label = b.textContent;
      const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = label, 1400); };
      const dd = b.closest(".kv-acts")?.previousElementSibling;
      navigator.clipboard?.writeText(v).then(done, () => { if (!dd) return; const r = document.createRange(); r.selectNodeContents(dd); getSelection().removeAllRanges(); getSelection().addRange(r); });
    }));
    const thread = $("#thread", body);
    if (thread) thread.addEventListener("click", e => {
      const li = e.target.closest("li");
      if (!li) return;
      const u = U.find(x => x.id === mode.id);
      const i = Number(li.dataset.i);
      const edit = e.target.closest("[data-note-edit]");
      if (edit) {
        const p = li.querySelector("p");
        if (li.classList.contains("editing")) {
          const next = li.querySelector("textarea").value.trim();
          if (!next) return;
          u.notes[i][1] = next;
          p.textContent = next;
          p.hidden = false;
          li.querySelector("textarea").remove();
          li.classList.remove("editing");
          edit.querySelector("use").setAttribute("href", "#i-pencil");
          edit.setAttribute("aria-label", "Edit note");
          return;
        }
        const ta = document.createElement("textarea");
        ta.value = u.notes[i][1];
        ta.setAttribute("aria-label", "Edit note");
        p.hidden = true;
        p.after(ta);
        li.classList.add("editing");
        li.querySelector(".note-ask").hidden = true;
        edit.querySelector("use").setAttribute("href", "#i-tick");
        edit.setAttribute("aria-label", "Save note");
        ta.focus();
        ta.addEventListener("keydown", ev => {
          if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); edit.click(); }
          else if (ev.key === "Escape") {
            p.hidden = false;
            ta.remove();
            li.classList.remove("editing");
            edit.querySelector("use").setAttribute("href", "#i-pencil");
            edit.setAttribute("aria-label", "Edit note");
          }
        });
        return;
      }
      if (e.target.closest("[data-note-del]")) { li.querySelector(".note-ask").hidden = false; return; }
      if (e.target.closest("[data-note-no]")) { li.querySelector(".note-ask").hidden = true; return; }
      if (e.target.closest("[data-note-yes]")) {
        u.notes.splice(i, 1);
        li.remove();
        thread.querySelectorAll("li").forEach((el, n) => el.dataset.i = n);
        const n = u.notes.length;
        thread.closest("section").querySelector("h3 span").textContent = `${n} ${n === 1 ? "entry" : "entries"}`;
      }
    });
    const shots = $("#shots", body);
    if (shots) shots.addEventListener("scroll", () => {
      const i = Math.round(shots.scrollLeft / (shots.firstElementChild.offsetWidth + 8));
      $("#dots", body).querySelectorAll("i").forEach((d, j) => d.classList.toggle("on", i === j));
    }, { passive: true });
    const form = $("#composer", body);
    if (form) {
      const ta = $("textarea", form), btn = $("button", form);
      ta.addEventListener("input", () => { btn.disabled = !ta.value.trim(); ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; });
      form.addEventListener("submit", e => {
        e.preventDefault();
        const t = ta.value.trim(); if (!t) return;
        const u = U.find(x => x.id === mode.id);
        const iso = "2026-10-19";
        u.notes.push([iso, t]);
        $("#thread", body).insertAdjacentHTML("beforeend", noteHTML(u.notes.length - 1, iso, t, "Today"));
        const n = u.notes.length;
        $("#thread", body).closest("section").querySelector("h3 span").textContent = `${n} ${n === 1 ? "entry" : "entries"}`;
        ta.value = ""; btn.disabled = true; ta.style.height = "";
      });
    }
  }

  /* ---------------- placeholder photos ---------------- */
  function photo(u, kind) {
    const pool = u.fac.pool, garden = u.fac.garden;
    if (kind === "living") return `<svg class="pic" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#E7E4DC"/><rect y="80" width="160" height="40" fill="#D3CBBE"/><rect x="20" y="14" width="76" height="48" fill="${u.tint}"/><path d="M20 14 H96 V62 H20 Z M58 14 V62 M20 38 H96" fill="none" stroke="#161A17" stroke-width="1.3"/><rect x="30" y="66" width="84" height="24" rx="2" fill="#161A17"/><rect x="24" y="72" width="14" height="16" fill="#2C3330"/><rect x="108" y="70" width="12" height="18" fill="#2C3330"/><rect x="132" y="86" width="3.5" height="20" fill="#5C6560"/><circle cx="133.5" cy="80" r="8" fill="#0C7A3E"/></svg>`;
    if (kind === "view") return `<svg class="pic" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#E3E8E4"/><rect x="12" y="42" width="26" height="78" fill="#2A312E"/><rect x="44" y="16" width="32" height="104" fill="#3C4742"/><rect x="82" y="50" width="20" height="70" fill="#24302C"/><rect x="108" y="30" width="36" height="90" fill="#4E5954"/><g fill="#E3E8E4"><rect x="50" y="26" width="5" height="7"/><rect x="60" y="26" width="5" height="7"/><rect x="50" y="40" width="5" height="7"/><rect x="60" y="40" width="5" height="7"/><rect x="116" y="40" width="6" height="8"/><rect x="128" y="40" width="6" height="8"/><rect x="116" y="56" width="6" height="8"/><rect x="128" y="56" width="6" height="8"/></g><rect y="92" width="160" height="28" fill="#161A17"/><rect y="98" width="160" height="2.5" fill="#78BE20"/></svg>`;
    return `<svg class="pic" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#E3E8E4"/><rect x="46" y="8" width="68" height="112" fill="#E7E4DC"/><g fill="#161A17"><rect x="56" y="16" width="7" height="8" opacity=".85"/><rect x="70" y="16" width="7" height="8" opacity=".35"/><rect x="84" y="16" width="7" height="8" opacity=".85"/><rect x="98" y="16" width="7" height="8" opacity=".55"/><rect x="56" y="30" width="7" height="8" opacity=".4"/><rect x="70" y="30" width="7" height="8" opacity=".85"/><rect x="84" y="30" width="7" height="8" opacity=".3"/><rect x="98" y="30" width="7" height="8" opacity=".85"/><rect x="56" y="44" width="7" height="8" opacity=".85"/><rect x="70" y="44" width="7" height="8" opacity=".5"/><rect x="84" y="44" width="7" height="8" opacity=".85"/><rect x="98" y="44" width="7" height="8" opacity=".25"/></g>${garden ? `<rect x="46" y="4" width="68" height="6" fill="#0C7A3E"/>` : ""}<rect x="46" y="96" width="68" height="24" fill="#2A312E"/><rect x="70" y="102" width="20" height="18" fill="#E7E4DC"/>${pool ? `<rect x="118" y="104" width="38" height="10" rx="2" fill="#9CC6D6"/>` : ""}${garden ? `<circle cx="28" cy="100" r="12" fill="#0C7A3E"/><rect x="26.5" y="104" width="3" height="16" fill="#5C6560"/>` : ""}</svg>`;
  }

  /* ---------------- desktop niceties ---------------- */
  // hovering a list card lights up its pin, and the other way round
  body.addEventListener("pointerover", e => { const c = e.target.closest("[data-open-u]"); const id = c ? c.dataset.openU : null; if (id !== hoverUnit) { hoverUnit = id; draw(); } });
  body.addEventListener("pointerleave", () => { if (hoverUnit) { hoverUnit = null; draw(); } });
  stage.addEventListener("pointerover", e => {
    const t = e.target.closest("[data-u]"), id = t ? t.dataset.u : null;
    if (id !== hoverUnit) { hoverUnit = id; draw(); body.querySelectorAll("[data-open-u]").forEach(c => c.classList.toggle("sel", c.dataset.openU === id)); }
  });
  $("#collapse").addEventListener("click", () => {
    const c = app.classList.toggle("collapsed");
    $("#collapse").setAttribute("aria-expanded", !c);
    $("#collapse").setAttribute("aria-label", c ? "Show side panel" : "Collapse side panel");
    draw();
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea")) return;
    const vc = visCenter(), step = 80;
    if (e.key === "+" || e.key === "=") zoomBy(1.6);
    else if (e.key === "-" || e.key === "_") zoomBy(1 / 1.6);
    else if (e.key.startsWith("Arrow")) {
      const dx = { ArrowLeft: step, ArrowRight: -step }[e.key] || 0, dy = { ArrowUp: step, ArrowDown: -step }[e.key] || 0;
      setCam(cam.k, cam.tx + dx, cam.ty + dy); clearTimeout(stage.wt); stage.wt = setTimeout(afterMove, 250);
    } else if (e.key === "Escape") {
      if (mode.v === "unit") openStation(U.find(u => u.id === mode.id).st);
      else if (mode.v === "edit") openUnit(mode.id);
      else if (mode.v === "add") openStation(mode.id);
      else if (mode.v === "station") goOverview();
    } else return;
    e.preventDefault();
  });

  function syncChrome() {
    const open = desk.matches || moreOpen;
    $("#fMore").hidden = !open;
    $("#filterCard").classList.toggle("open", open && !desk.matches);
    $("#moreFilters").setAttribute("aria-expanded", String(open));
    const h = $("#chrome").offsetHeight;
    app.style.setProperty("--chrome-h", h + "px");
    sheet.style.top = desk.matches ? "16px" : "";
  }
  desk.addEventListener("change", () => { syncChrome(); measure(); draw(); });

  /* ---------------- boot ---------------- */
  render();
  measure();
  setSheet("peek");
  syncChrome();
  cam.k = k0; home(false);
  draw();
  new ResizeObserver(() => { const z = cam.k / k0; syncChrome(); measure(); setSheet(sheetState === "full" && !desk.matches && mode.v !== "unit" && mode.v !== "add" && mode.v !== "edit" ? "half" : sheetState); if (mode.v === "station") focusStation(mode.id, false); else if (mode.v === "overview" && z < 1.5) home(false); else draw(); }).observe(stage);
  const hash = location.hash.slice(1);
  if (hash === "thonglo") openStation("E6");
  else if (hash.startsWith("unit-")) openUnit(hash.slice(5));
  else if (hash.startsWith("edit-")) openEdit(hash.slice(5));
  else if (hash.startsWith("add-")) openAdd(hash.slice(4));
})();
</script>
</body>
</html>
